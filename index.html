<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>To-Do — a simple to-do list</title>
<meta name="description" content="A minimalist to-do list with recurring tasks, stored entirely on your device." />

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#3A4A3E" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="To-Do" />

<style>
  :root{
    --paper: #FAFAF8;
    --ink: #22241F;
    --ink-soft: #55584F;
    --muted: #9A968C;
    --line: #E7E3D8;
    --pine: #3A4A3E;
    --pine-dark: #2C3A31;
    --sage: #7C9885;
    --sage-bg: #EAF0EB;
    --danger: #B5533C;
    --danger-bg: #F7EAE6;
    --radius: 14px;
  }

  *{
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    -moz-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  input, textarea{
    -webkit-user-select: text;
    -moz-user-select: text;
    user-select: text;
    -webkit-touch-callout: default;
  }

  html, body{ height: 100%; }

  body{
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
  }

  .app{
    max-width: 560px;
    margin: 0 auto;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) 24px calc(140px + env(safe-area-inset-bottom));
    position: relative;
  }

  header{
    padding: 48px 0 18px;
  }

  .date{
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", ui-serif, serif;
    font-size: clamp(30px, 7vw, 40px);
    line-height: 1.1;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
    color: var(--ink);
  }

  .status{ display: flex; align-items: center; gap: 10px; margin: 0; }

  .progress-track{
    flex: 1 1 auto;
    height: 7px;
    border-radius: 999px;
    background: var(--sage-bg);
    overflow: hidden;
  }

  .progress-fill{
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: var(--pine);
    transition: width 0.25s ease;
  }

  .progress-count{
    flex: 0 0 auto;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    min-width: 34px;
    text-align: right;
  }

  .date-strip-wrap{
    padding: 14px 0 10px;
    margin-bottom: 4px;
    border-bottom: 1px solid var(--line);
  }

  .date-strip{
    display: flex;
    gap: 4px;
  }

  .date-cell{
    flex: 1 1 0;
    min-width: 0;
    padding: 4px 0 2px;
    border: none;
    background: none;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    position: relative;
    border-radius: 12px;
    transition: background 0.15s ease;
  }

  .date-cell:hover{ background: var(--sage-bg); }
  .date-cell.selected:hover{ background: none; }

  .date-cell .dow{
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .date-cell .num{
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink-soft);
    transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
  }

  .date-cell.today .num{
    box-shadow: inset 0 0 0 1.5px var(--pine);
    color: var(--pine-dark);
  }

  .date-cell.selected .num{
    background: var(--pine);
    color: var(--paper);
    box-shadow: none;
  }

  .date-cell::after{
    content: "";
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: transparent;
  }

  .date-cell.has-tasks::after{ background: var(--sage); }
  .date-cell.selected.has-tasks::after{ background: var(--pine); }

  main{ padding-top: 4px; }

  .day-section{ border-bottom: 1px solid var(--line); }
  .day-section:last-child{ border-bottom: none; }
  .day-section.overdue .day-heading{ color: var(--danger); }

  .day-heading{
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 22px 0 4px;
    font-size: 15px;
    font-weight: 700;
    color: var(--ink-soft);
  }

  .day-heading .count{ font-weight: 400; font-size: 13px; color: var(--muted); }

  ul.list{ list-style: none; margin: 0; padding: 0 0 6px; }

  .nothing{
    padding: 6px 0 14px;
    font-size: 13.5px;
    color: var(--muted);
    font-style: italic;
  }

  .task{
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-top: 1px solid var(--line);
    background: var(--paper);
  }

  .task.dragging{
    box-shadow: 0 8px 20px rgba(34, 36, 31, 0.14);
    border-radius: 10px;
    z-index: 5;
  }

  ul.list > .task:first-child{ border-top: none; }

  .check{
    flex: 0 0 auto;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1.5px solid var(--muted);
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }

  .check:active{ transform: scale(0.92); }

  .check svg{
    width: 13px;
    height: 13px;
    opacity: 0;
    transform: scale(0.6);
    transition: opacity 0.12s ease, transform 0.12s ease;
    color: var(--paper);
  }

  .task.done .check{ background: var(--pine); border-color: var(--pine); }
  .task.done .check svg{ opacity: 1; transform: scale(1); }

  .text{
    flex: 1 1 auto;
    min-width: 0;
    font-size: 16px;
    line-height: 1.35;
    color: var(--ink);
    word-break: break-word;
  }

  .task.done .text{
    color: var(--muted);
    text-decoration: line-through;
    text-decoration-color: var(--line);
  }

  .badge{
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--pine-dark);
    background: var(--sage-bg);
    border-radius: 999px;
    padding: 4px 8px;
    white-space: nowrap;
  }

  .badge svg{ width: 10px; height: 10px; }

  .day-section.overdue .task .badge{ color: var(--danger); background: var(--danger-bg); }

  .drag-handle{
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    border: none;
    background: none;
    color: var(--muted);
    cursor: grab;
    touch-action: none;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.55;
    transition: opacity 0.15s ease, background 0.15s ease;
  }

  .drag-handle:hover{ opacity: 1; background: var(--line); }
  .drag-handle svg{ width: 16px; height: 16px; }
  .drag-handle:active{ cursor: grabbing; }

  .empty{
    padding: 40px 0 20px;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.6;
  }

  .clear-row{ padding: 16px 0 20px; }

  .clear-btn{
    border: none;
    background: none;
    color: var(--muted);
    font-size: 13px;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    padding: 4px 0;
  }

  .clear-btn:hover{ color: var(--ink-soft); }

  .task-menu-backdrop{
    position: fixed;
    inset: 0;
    z-index: 39;
    display: none;
  }

  .task-menu-backdrop.open{ display: block; }

  .task-menu{
    position: fixed;
    z-index: 40;
    background: var(--paper);
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(34, 36, 31, 0.22);
    border: 1px solid var(--line);
    padding: 6px;
    min-width: 150px;
    display: none;
    flex-direction: column;
  }

  .task-menu.open{ display: flex; }

  .task-menu-item{
    border: none;
    background: none;
    text-align: left;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    color: var(--ink-soft);
    padding: 11px 12px;
    border-radius: 8px;
    cursor: pointer;
  }

  .task-menu-item:hover{ background: var(--sage-bg); color: var(--pine-dark); }
  .task-menu-item.danger{ color: var(--danger); }
  .task-menu-item.danger:hover{ background: var(--danger-bg); }

  .fab{
    position: fixed;
    right: max(24px, calc(24px + env(safe-area-inset-right)));
    bottom: max(28px, calc(28px + env(safe-area-inset-bottom)));
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: var(--pine);
    color: var(--paper);
    border: none;
    box-shadow: 0 10px 24px rgba(44, 58, 49, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    z-index: 20;
  }

  .fab:hover{ background: var(--pine-dark); box-shadow: 0 12px 28px rgba(44, 58, 49, 0.42); }
  .fab:active{ transform: scale(0.94); }
  .fab svg{ width: 26px; height: 26px; }

  .backdrop{
    position: fixed;
    inset: 0;
    background: rgba(34, 36, 31, 0.36);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 30;
  }

  .backdrop.open{ opacity: 1; pointer-events: auto; }

  .sheet{
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--paper);
    border-radius: 22px 22px 0 0;
    padding: 26px 24px calc(28px + env(safe-area-inset-bottom));
    max-width: 560px;
    margin: 0 auto;
    max-height: 86dvh;
    overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.28s cubic-bezier(.32,.72,0,1);
    z-index: 31;
    box-shadow: 0 -12px 40px rgba(34,36,31,0.18);
  }

  .sheet.open{ transform: translateY(0); }

  .sheet-handle{
    width: 36px;
    height: 4px;
    border-radius: 2px;
    background: var(--line);
    margin: 0 auto 20px;
  }

  .sheet h2{ margin: 0 0 16px; font-size: 19px; font-weight: 600; }

  .field input[type="text"]{
    width: 100%;
    font-size: 16px;
    padding: 13px 14px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    outline: none;
  }

  .field input[type="text"]:focus{ border-color: var(--pine); }

  .sub-label{
    font-size: 12.5px;
    font-weight: 600;
    color: var(--muted);
    margin: 20px 0 8px;
  }

  .chip-row{ display: flex; gap: 8px; flex-wrap: wrap; }

  .chip{
    flex: 1 1 auto;
    text-align: center;
    padding: 10px 12px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: transparent;
    color: var(--ink-soft);
    font-size: 13.5px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }

  .chip.active{
    background: var(--sage-bg);
    border-color: var(--sage);
    color: var(--pine-dark);
    font-weight: 600;
  }

  input[type="date"]{
    margin-top: 10px;
    width: 100%;
    font-size: 15px;
    padding: 11px 12px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    outline: none;
  }

  input[type="date"]:focus{ border-color: var(--pine); }

  .sheet-actions{ display: flex; gap: 10px; margin-top: 24px; }

  .btn{
    flex: 1;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  .btn.primary{ background: var(--pine); color: var(--paper); }
  .btn.primary:disabled{ background: var(--line); color: var(--muted); cursor: not-allowed; }
  .btn.primary:not(:disabled):hover{ background: var(--pine-dark); }

  .btn.ghost{ background: transparent; color: var(--muted); }
  .btn.ghost:hover{ color: var(--ink-soft); }

  @media (prefers-reduced-motion: reduce){ *{ transition: none !important; } }

  @media (max-width: 380px){ .app{ padding-left: 18px; padding-right: 18px; } }
</style>
</head>
<body>

<div class="app">
  <header>
    <p class="date" id="dateHeading"></p>
    <div class="status" id="statusLine">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-count" id="progressCount"></span>
    </div>
  </header>

  <div class="date-strip-wrap" id="dateStripWrap">
    <div class="date-strip" id="dateStrip"></div>
  </div>

  <main id="agenda"></main>

  <p class="empty" id="emptyState" hidden>Nothing here yet. Add your first task with the button in the corner.</p>
  <div class="clear-row" id="clearRow" hidden>
    <button class="clear-btn" id="clearCompleted">Clear completed one-off tasks</button>
  </div>
</div>

<div class="task-menu" id="taskMenu" role="menu">
  <button class="task-menu-item" id="taskMenuEdit" type="button" role="menuitem">Edit</button>
  <button class="task-menu-item danger" id="taskMenuDelete" type="button" role="menuitem">Delete</button>
</div>
<div class="task-menu-backdrop" id="taskMenuBackdrop"></div>

<button class="fab" id="openAdd" aria-label="Add task">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="4" x2="12" y2="20"/><line x1="4" y1="12" x2="20" y2="12"/></svg>
</button>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-handle"></div>
  <h2 id="sheetTitle">New task</h2>
  <div class="field">
    <input type="text" id="taskInput" placeholder="What do you need to do?" maxlength="140" autocomplete="off" />
  </div>

  <p class="sub-label">Repeat</p>
  <div class="chip-row" id="repeatRow">
    <button class="chip active" data-value="none" type="button">No repeat</button>
    <button class="chip" data-value="daily" type="button">Daily</button>
    <button class="chip" data-value="weekly" type="button">Weekly</button>
    <button class="chip" data-value="monthly" type="button">Monthly</button>
  </div>

  <p class="sub-label" id="dateLabel">Date</p>
  <div class="chip-row" id="dateRow">
    <button class="chip active" data-value="today" type="button">Today</button>
    <button class="chip" data-value="tomorrow" type="button">Tomorrow</button>
    <button class="chip" data-value="pick" type="button">Choose date</button>
  </div>
  <input type="date" id="datePicker" hidden />

  <div class="sheet-actions">
    <button class="btn ghost" id="cancelAdd" type="button">Cancel</button>
    <button class="btn primary" id="confirmAdd" type="button" disabled>Add task</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "repeat-todo-tasks-v2";

  var agendaEl = document.getElementById("agenda");
  var dateStripEl = document.getElementById("dateStrip");
  var emptyEl = document.getElementById("emptyState");
  var clearRow = document.getElementById("clearRow");
  var clearBtn = document.getElementById("clearCompleted");
  var statusLine = document.getElementById("statusLine");
  var progressFill = document.getElementById("progressFill");
  var progressCount = document.getElementById("progressCount");
  var dateHeading = document.getElementById("dateHeading");
  var taskMenu = document.getElementById("taskMenu");
  var taskMenuEdit = document.getElementById("taskMenuEdit");
  var taskMenuDelete = document.getElementById("taskMenuDelete");
  var taskMenuBackdrop = document.getElementById("taskMenuBackdrop");

  var fab = document.getElementById("openAdd");
  var backdrop = document.getElementById("backdrop");
  var sheet = document.getElementById("sheet");
  var sheetTitle = document.getElementById("sheetTitle");
  var taskInput = document.getElementById("taskInput");
  var repeatRow = document.getElementById("repeatRow");
  var dateRow = document.getElementById("dateRow");
  var dateLabel = document.getElementById("dateLabel");
  var datePicker = document.getElementById("datePicker");
  var confirmAdd = document.getElementById("confirmAdd");
  var cancelAdd = document.getElementById("cancelAdd");

  var selectedRecurrence = "none";
  var selectedDateMode = "today";
  var selectedDateKey = null;
  var editingTaskId = null;
  var menuTaskId = null;

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function loadTasks(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }

  function saveTasks(t){ localStorage.setItem(STORAGE_KEY, JSON.stringify(t)); }

  var tasks = loadTasks();

  function pad(n){ return n < 10 ? "0" + n : "" + n; }

  function dateKey(d){ return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }

  function keyToDate(key){
    var parts = key.split("-");
    return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
  }

  function addDays(d, n){
    var copy = new Date(d.getTime());
    copy.setDate(copy.getDate() + n);
    return copy;
  }

  function startOfToday(){
    var n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  }

  function startOfWeek(day){
    var diff = (day.getDay() + 6) % 7;
    return addDays(day, -diff);
  }

  function weekKey(d){
    var date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var day = date.getUTCDay() || 7;
    date.setUTCDate(date.getUTCDate() + 4 - day);
    var yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
    var weekNo = Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
    return date.getUTCFullYear() + "-W" + pad(weekNo);
  }

  function monthKey(d){ return d.getFullYear() + "-" + pad(d.getMonth() + 1); }

  function periodKeyFor(recurrence, d){
    if(recurrence === "daily") return dateKey(d);
    if(recurrence === "weekly") return weekKey(d);
    if(recurrence === "monthly") return monthKey(d);
    return null;
  }

  function lastDayOfMonth(year, month){ return new Date(year, month + 1, 0).getDate(); }

  function occursOn(task, day){
    var dKey = dateKey(day);
    if(task.recurrence === "none"){
      return dKey === task.anchorDate;
    }
    if(dKey < task.anchorDate) return false;
    var anchor = keyToDate(task.anchorDate);
    if(task.recurrence === "daily") return true;
    if(task.recurrence === "weekly") return day.getDay() === anchor.getDay();
    if(task.recurrence === "monthly"){
      var target = Math.min(anchor.getDate(), lastDayOfMonth(day.getFullYear(), day.getMonth()));
      return day.getDate() === target;
    }
    return false;
  }

  function isDoneOn(task, day){
    if(task.recurrence === "none") return !!task.done;
    var period = periodKeyFor(task.recurrence, day);
    return task.lastCompletedPeriod === period;
  }

  function toggleTaskOn(id, day){
    tasks = tasks.map(function(t){
      if(t.id !== id) return t;
      if(t.recurrence === "none"){
        return Object.assign({}, t, { done: !t.done });
      }
      var period = periodKeyFor(t.recurrence, day);
      var currentlyDone = t.lastCompletedPeriod === period;
      return Object.assign({}, t, { lastCompletedPeriod: currentlyDone ? null : period });
    });
    saveTasks(tasks);
    render();
  }

  function deleteTask(id){
    tasks = tasks.filter(function(t){ return t.id !== id; });
    saveTasks(tasks);
    render();
  }

  function updateTask(id, text, recurrence, anchorDate){
    tasks = tasks.map(function(t){
      if(t.id !== id) return t;
      return Object.assign({}, t, { text: text, recurrence: recurrence, anchorDate: anchorDate });
    });
    saveTasks(tasks);
    render();
  }

  function reorderTasksForDay(orderedIds){
    var indexInOrder = {};
    orderedIds.forEach(function(id, i){ indexInOrder[id] = i; });
    var among = tasks.filter(function(t){ return indexInOrder.hasOwnProperty(t.id); });
    among.sort(function(a, b){ return indexInOrder[a.id] - indexInOrder[b.id]; });
    var cursor = 0;
    tasks = tasks.map(function(t){
      if(indexInOrder.hasOwnProperty(t.id)) return among[cursor++];
      return t;
    });
    saveTasks(tasks);
  }

  function addTask(text, recurrence, anchorDate){
    tasks.push({
      id: uid(),
      text: text,
      recurrence: recurrence,
      anchorDate: anchorDate,
      done: false,
      lastCompletedPeriod: null,
      createdAt: new Date().toISOString()
    });
    saveTasks(tasks);
    render();
  }

  function recurrenceLabel(r){
    if(r === "daily") return "Daily";
    if(r === "weekly") return "Weekly";
    if(r === "monthly") return "Monthly";
    return "";
  }

  var repeatIconSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>';
  var checkIconSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
  var gripIconSVG = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="9" cy="18" r="1.6"></circle><circle cx="15" cy="6" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="15" cy="18" r="1.6"></circle></svg>';

  function renderTaskRow(task, day, done){
    var li = document.createElement("li");
    li.className = "task" + (done ? " done" : "");
    li.dataset.taskId = task.id;

    var handle = document.createElement("button");
    handle.className = "drag-handle";
    handle.type = "button";
    handle.setAttribute("aria-label", "Reorder task");
    handle.innerHTML = gripIconSVG;

    var check = document.createElement("button");
    check.className = "check";
    check.setAttribute("aria-label", done ? "Mark as not done" : "Mark as done");
    check.innerHTML = checkIconSVG;
    check.addEventListener("click", function(){ toggleTaskOn(task.id, day); });

    var text = document.createElement("p");
    text.className = "text";
    text.textContent = task.text;

    li.appendChild(handle);
    li.appendChild(check);
    li.appendChild(text);

    if(task.recurrence !== "none"){
      var badge = document.createElement("span");
      badge.className = "badge";
      badge.innerHTML = repeatIconSVG + "<span>" + recurrenceLabel(task.recurrence) + "</span>";
      li.appendChild(badge);
    }

    attachLongPress(text, function(e){ openTaskMenu(task.id, e); });
    initDragHandle(li, handle);

    return li;
  }

  function attachLongPress(el, callback){
    var LONG_PRESS_MS = 450;
    var MOVE_TOLERANCE = 10;
    var timer = null;
    var startX = 0, startY = 0;

    function clear(){
      if(timer){ clearTimeout(timer); timer = null; }
    }

    el.addEventListener("pointerdown", function(e){
      if(e.pointerType === "mouse" && e.button !== 0) return;
      startX = e.clientX;
      startY = e.clientY;
      clear();
      timer = setTimeout(function(){
        timer = null;
        callback(e);
      }, LONG_PRESS_MS);
    });

    el.addEventListener("pointermove", function(e){
      if(timer && (Math.abs(e.clientX - startX) > MOVE_TOLERANCE || Math.abs(e.clientY - startY) > MOVE_TOLERANCE)){
        clear();
      }
    });

    ["pointerup", "pointercancel", "pointerleave"].forEach(function(evName){
      el.addEventListener(evName, clear);
    });

    el.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  }

  function initDragHandle(li, handle){
    handle.addEventListener("pointerdown", function(e){
      e.preventDefault();
      var list = li.parentNode;
      if(!list) return;

      var pointerId = e.pointerId;
      var startY = e.clientY;
      var active = true;

      li.classList.add("dragging");

      function onMove(ev){
        if(!active || ev.pointerId !== pointerId) return;
        var dy = ev.clientY - startY;
        li.style.transform = "translateY(" + dy + "px)";

        var liRect = li.getBoundingClientRect();
        var liMid = liRect.top + liRect.height / 2;
        var siblings = Array.prototype.filter.call(list.children, function(c){ return c !== li; });

        for(var i = 0; i < siblings.length; i++){
          var sib = siblings[i];
          var r = sib.getBoundingClientRect();
          var mid = r.top + r.height / 2;
          if(dy < 0 && liMid < mid){
            list.insertBefore(li, sib);
            startY = ev.clientY;
            li.style.transform = "translateY(0px)";
            break;
          }else if(dy > 0 && liMid > mid){
            list.insertBefore(li, sib.nextSibling);
            startY = ev.clientY;
            li.style.transform = "translateY(0px)";
            break;
          }
        }
      }

      function finish(ev){
        if(!active) return;
        if(ev && ev.pointerId !== pointerId) return;
        active = false;

        document.removeEventListener("pointermove", onMove);
        document.removeEventListener("pointerup", finish);
        document.removeEventListener("pointercancel", finish);
        try{ handle.releasePointerCapture(pointerId); }catch(err){}

        li.classList.remove("dragging");
        li.style.transform = "";
        handle.blur();
        if(document.activeElement && typeof document.activeElement.blur === "function"){
          document.activeElement.blur();
        }

        var newOrder = Array.prototype.map.call(list.children, function(c){ return c.dataset.taskId; });
        reorderTasksForDay(newOrder);
        render();
      }

      document.addEventListener("pointermove", onMove);
      document.addEventListener("pointerup", finish);
      document.addEventListener("pointercancel", finish);
    });
  }

  function openTaskMenu(taskId, e){
    menuTaskId = taskId;
    taskMenu.classList.add("open");
    taskMenuBackdrop.classList.add("open");

    var menuWidth = 160;
    var menuHeight = 96;
    var x = e.clientX;
    var y = e.clientY;
    var maxX = window.innerWidth - menuWidth - 12;
    var maxY = window.innerHeight - menuHeight - 12;
    taskMenu.style.left = Math.max(12, Math.min(x, maxX)) + "px";
    taskMenu.style.top = Math.max(12, Math.min(y, maxY)) + "px";

    if(navigator.vibrate){ try{ navigator.vibrate(8); }catch(err){} }
  }

  function closeTaskMenu(){
    menuTaskId = null;
    taskMenu.classList.remove("open");
    taskMenuBackdrop.classList.remove("open");
  }

  taskMenuBackdrop.addEventListener("click", closeTaskMenu);

  taskMenuDelete.addEventListener("click", function(){
    var id = menuTaskId;
    closeTaskMenu();
    if(id) deleteTask(id);
  });

  taskMenuEdit.addEventListener("click", function(){
    var id = menuTaskId;
    closeTaskMenu();
    var task = tasks.find(function(t){ return t.id === id; });
    if(task) openSheet(task);
  });

  function dayHeadingText(day, todayStart){
    var diff = Math.round((day - todayStart) / 86400000);
    if(diff === 0) return "Today";
    if(diff === 1) return "Tomorrow";
    return day.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  }

  function buildDaySection(day, todayStart){
    var section = document.createElement("section");
    section.className = "day-section";

    var occurring = tasks
      .filter(function(t){ return occursOn(t, day); })
      .map(function(t){ return { task: t, done: isDoneOn(t, day) }; });

    var heading = document.createElement("div");
    heading.className = "day-heading";
    var label = document.createElement("span");
    label.textContent = dayHeadingText(day, todayStart);
    heading.appendChild(label);
    if(occurring.length){
      var doneCount = occurring.filter(function(e){ return e.done; }).length;
      var count = document.createElement("span");
      count.className = "count";
      count.textContent = doneCount + " of " + occurring.length + " done";
      heading.appendChild(count);
    }
    section.appendChild(heading);

    if(occurring.length === 0){
      var nothing = document.createElement("p");
      nothing.className = "nothing";
      nothing.textContent = "Nothing scheduled";
      section.appendChild(nothing);
      return section;
    }

    var ul = document.createElement("ul");
    ul.className = "list";
    occurring.forEach(function(entry){
      ul.appendChild(renderTaskRow(entry.task, day, entry.done));
    });
    section.appendChild(ul);
    return section;
  }

  function renderDateStrip(todayKey, selKey){
    var weekStart = startOfWeek(keyToDate(todayKey));
    dateStripEl.innerHTML = "";

    for(var i = 0; i < 7; i++){
      var day = addDays(weekStart, i);
      var key = dateKey(day);
      var hasTasks = tasks.some(function(t){ return occursOn(t, day); });

      var cell = document.createElement("button");
      cell.type = "button";
      cell.className = "date-cell";
      if(key === todayKey) cell.classList.add("today");
      if(key === selKey) cell.classList.add("selected");
      if(hasTasks) cell.classList.add("has-tasks");
      cell.dataset.date = key;

      var dow = document.createElement("span");
      dow.className = "dow";
      dow.textContent = day.toLocaleDateString(undefined, { weekday: "short" }).slice(0, 3);

      var num = document.createElement("span");
      num.className = "num";
      num.textContent = day.getDate();

      cell.appendChild(dow);
      cell.appendChild(num);
      cell.addEventListener("click", function(){
        selectedDateKey = this.dataset.date;
        render();
      });
      dateStripEl.appendChild(cell);
    }
  }

  function render(){
    var todayStart = startOfToday();
    var todayKey = dateKey(todayStart);
    if(!selectedDateKey) selectedDateKey = todayKey;
    var selDate = keyToDate(selectedDateKey);

    agendaEl.innerHTML = "";
    emptyEl.hidden = tasks.length !== 0;

    var overdue = tasks.filter(function(t){
      return t.recurrence === "none" && !t.done && t.anchorDate < todayKey;
    });

    if(overdue.length){
      var section = document.createElement("section");
      section.className = "day-section overdue";
      var heading = document.createElement("div");
      heading.className = "day-heading";
      heading.innerHTML = "<span>Overdue</span>";
      section.appendChild(heading);
      var ul = document.createElement("ul");
      ul.className = "list";
      overdue.forEach(function(t){
        ul.appendChild(renderTaskRow(t, todayStart, false));
      });
      section.appendChild(ul);
      agendaEl.appendChild(section);
    }

    agendaEl.appendChild(buildDaySection(selDate, todayStart));

    var doneOneOff = tasks.filter(function(t){ return t.recurrence === "none" && t.done; });
    clearRow.hidden = doneOneOff.length === 0;

    var selOccurring = tasks.filter(function(t){ return occursOn(t, selDate); });
    var selDone = selOccurring.filter(function(t){ return isDoneOn(t, selDate); }).length;
    var pct = selOccurring.length ? Math.round((selDone / selOccurring.length) * 100) : 0;

    progressFill.style.width = pct + "%";
    progressCount.textContent = selDone + "/" + selOccurring.length;

    dateHeading.textContent = selDate.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

    renderDateStrip(todayKey, selectedDateKey);
  }

  clearBtn.addEventListener("click", function(){
    tasks = tasks.filter(function(t){ return !(t.recurrence === "none" && t.done); });
    saveTasks(tasks);
    render();
  });

  function resetSheet(){
    taskInput.value = "";
    selectedRecurrence = "none";
    selectedDateMode = "today";
    datePicker.hidden = true;
    datePicker.value = "";
    dateLabel.textContent = "Date";
    updateChips(repeatRow, "none");
    updateChips(dateRow, "today");
    updateConfirmState();
  }

  function fillSheetForTask(task){
    taskInput.value = task.text;
    selectedRecurrence = task.recurrence;
    updateChips(repeatRow, selectedRecurrence);
    dateLabel.textContent = selectedRecurrence === "none" ? "Date" : "Starting";

    var todayKey = dateKey(startOfToday());
    var tomorrowKey = dateKey(addDays(startOfToday(), 1));

    if(task.anchorDate === todayKey){
      selectedDateMode = "today";
      datePicker.hidden = true;
      datePicker.value = "";
    }else if(task.anchorDate === tomorrowKey){
      selectedDateMode = "tomorrow";
      datePicker.hidden = true;
      datePicker.value = "";
    }else{
      selectedDateMode = "pick";
      datePicker.hidden = false;
      datePicker.min = todayKey;
      datePicker.value = task.anchorDate;
    }
    updateChips(dateRow, selectedDateMode);
    updateConfirmState();
  }

  function openSheet(taskToEdit){
    editingTaskId = taskToEdit ? taskToEdit.id : null;
    sheetTitle.textContent = taskToEdit ? "Edit task" : "New task";
    confirmAdd.textContent = taskToEdit ? "Save changes" : "Add task";
    backdrop.classList.add("open");
    sheet.classList.add("open");
    if(taskToEdit){
      fillSheetForTask(taskToEdit);
    }else{
      resetSheet();
    }
    setTimeout(function(){ taskInput.focus(); }, 260);
  }

  function closeSheet(){
    backdrop.classList.remove("open");
    sheet.classList.remove("open");
    editingTaskId = null;
  }

  function updateChips(row, value){
    Array.prototype.forEach.call(row.children, function(chip){
      chip.classList.toggle("active", chip.dataset.value === value);
    });
  }

  function updateConfirmState(){
    var hasText = taskInput.value.trim().length > 0;
    var hasDate = selectedDateMode !== "pick" || !!datePicker.value;
    confirmAdd.disabled = !(hasText && hasDate);
  }

  fab.addEventListener("click", function(){ openSheet(); });
  cancelAdd.addEventListener("click", closeSheet);
  backdrop.addEventListener("click", closeSheet);

  repeatRow.addEventListener("click", function(e){
    var chip = e.target.closest(".chip");
    if(!chip) return;
    selectedRecurrence = chip.dataset.value;
    updateChips(repeatRow, selectedRecurrence);
    dateLabel.textContent = selectedRecurrence === "none" ? "Date" : "Starting";
  });

  dateRow.addEventListener("click", function(e){
    var chip = e.target.closest(".chip");
    if(!chip) return;
    selectedDateMode = chip.dataset.value;
    updateChips(dateRow, selectedDateMode);
    if(selectedDateMode === "pick"){
      datePicker.hidden = false;
      var minDate = dateKey(startOfToday());
      datePicker.min = minDate;
      if(!datePicker.value) datePicker.value = minDate;
    }else{
      datePicker.hidden = true;
    }
    updateConfirmState();
  });

  datePicker.addEventListener("change", updateConfirmState);
  taskInput.addEventListener("input", updateConfirmState);

  taskInput.addEventListener("keydown", function(e){
    if(e.key === "Enter" && !confirmAdd.disabled) confirmAdd.click();
  });

  confirmAdd.addEventListener("click", function(){
    var text = taskInput.value.trim();
    if(!text) return;

    var anchorDate;
    if(selectedDateMode === "today"){
      anchorDate = dateKey(startOfToday());
    }else if(selectedDateMode === "tomorrow"){
      anchorDate = dateKey(addDays(startOfToday(), 1));
    }else{
      anchorDate = datePicker.value || dateKey(startOfToday());
    }

    if(editingTaskId){
      updateTask(editingTaskId, text, selectedRecurrence, anchorDate);
    }else{
      addTask(text, selectedRecurrence, anchorDate);
    }
    closeSheet();
  });

  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && sheet.classList.contains("open")) closeSheet();
  });

  render();

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
})();
</script>
